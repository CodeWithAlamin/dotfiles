[bar.default]
background_opacity = 0.0
capsule = true
center = [ "media", "clock", "ocr" ]
end = [ "tray", "notifications", "clipboard", "group:g1", "battery", "group:g2", "control-center" ]
margin_ends = 0
padding = 0
start = [ "launcher", "workspaces", "network_rx" ]

    [bar.default.dead_zone.actions]
    scroll_down = "exec exec niri msg action focus-column-right"
    scroll_up = "exec exec niri msg action focus-column-left"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "bluetooth", "network" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000003" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.00018310546875
    cy = 747.91650390625
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 288.0
    box_width = 496.0
    cx = 800.0
    cy = 130.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        font_family = ""
        format = "{:%-I:%M %p}"
        shadow = true
        timezone = ""

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 800.00018310546875
    cy = 399.99993896484375
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        bar_width = 0.59999999999999998
        bloom_intensity = 0.5
        fade_when_idle = true
        inner_diameter = 0.69999999999999996
        primary_color = "primary"
        ring_opacity = 0.80000000000000004
        rotation_speed = 0.5
        secondary_color = "secondary"
        sensitivity = 1.5
        visualization_mode = "bars_rings"
        wave_thickness = 1.0

[notification]
position = "bottom_right"

[plugin_settings."danielel/owntone-control"]
host = ""

[plugin_settings."fel/ocr"]
languages = "eng+ben"

[plugin_settings."umedbazarov/ruh-vpn"]
backend_python = "~/.local/share/ruh-vpn-venv/bin/python3"

[plugins]
enabled = [ "blackbartblues/keymap", "fel/ocr", "thaer99ob/default-apps", "noctalia/notes", "tordex/processes" ]

[shell]
avatar_path = "/home/cwa/cwa.png"
polkit_agent = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "loginctl lock-session && systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    label = "Hibernate"
    shortcut = "6"
    variant = "default"

[theme]
builtin = "Catppuccin"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]

[wallpaper]
directory = "/home/cwa/Curated-wallpapers"

    [wallpaper.default]
    path = "/home/cwa/Curated-wallpapers/Fantasy-Hongkong.png"

    [wallpaper.last]
    path = "/home/cwa/Curated-wallpapers/Fantasy-Hongkong.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/cwa/Curated-wallpapers/Fantasy-Hongkong.png"

[widget.clock]
format = "{:%-I:%M %p} | {:%a} - {:%-d %b}"

[widget.control-center.actions]
scroll_down = "volume-down"
scroll_up = "volume-up"

[widget.launcher.actions]
scroll_down = "brightness-down"
scroll_up = "brightness-up"

[widget.media]
hide_when_no_media = true

    [widget.media.actions]
    scroll_down = "none"
    scroll_up = "none"

[widget.ocr]
type = "fel/ocr:ocr"
